services:

  productos-db:
    image: postgres:16-alpine
    container_name: productos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: productos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - productos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pedidos360-net

  pedidos-db:
    image: postgres:16-alpine
    container_name: pedidos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pedidos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pedidos360-net

  productos-service:
    build:
      context: ./backend/productos-service
    container_name: productos-service
    restart: unless-stopped
    environment:
      DB_HOST: productos-db
      DB_PORT: 5432
      DB_NAME: productos_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      productos-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - pedidos360-net

  pedidos-service:
    build:
      context: ./backend/pedidos-service
    container_name: pedidos-service
    restart: unless-stopped
    environment:
      DB_HOST: pedidos-db
      DB_PORT: 5432
      DB_NAME: pedidos_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PRODUCTOS_SERVICE_URL: http://productos-service:8081
      # Parcial 2: publicación de eventos en SNS (credenciales del Learner Lab desde el archivo .env)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      TOPICO_EVENTOS: pedidos360-eventos
    depends_on:
      pedidos-db:
        condition: service_healthy
      productos-service:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - pedidos360-net

  # ---------------------------------------------------------------- Parcial 2: mensajería
  eventos-db:
    image: postgres:16-alpine
    container_name: eventos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - eventos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pedidos360-net

  mensajeria-admin:
    build:
      context: ./backend/mensajeria-admin
    container_name: mensajeria-admin
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEGURIDAD_HABILITADA: ${SEGURIDAD_HABILITADA:-true}
      EVENTOS_SERVICE_URLS: http://eventos-service:8083
    ports:
      - "8090:8090"
    networks:
      - pedidos360-net

  eventos-service:
    build:
      context: ./backend/eventos-service
    container_name: eventos-service
    restart: unless-stopped
    environment:
      DB_HOST: eventos-db
      DB_PORT: 5432
      DB_NAME: eventos_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      SIMULAR_FALLO_CORREO: ${SIMULAR_FALLO_CORREO:-false}
    depends_on:
      eventos-db:
        condition: service_healthy
      mensajeria-admin:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - pedidos360-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_COGNITO_REGION: ${VITE_COGNITO_REGION}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${VITE_COGNITO_USER_POOL_CLIENT_ID}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-}
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - productos-service
      - pedidos-service
      - mensajeria-admin
    ports:
      - "3000:80"
    networks:
      - pedidos360-net

networks:
  pedidos360-net:
    driver: bridge

volumes:
  productos_db_data:
  pedidos_db_data:
  eventos_db_data:
