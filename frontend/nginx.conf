server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy local opcional: expone un único punto de entrada /api que
    # enruta a productos-service y pedidos-service, simulando el rol de API Gateway.
    location /api/productos {
        proxy_pass http://productos-service:8081/api/productos;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    location /api/pedidos {
        proxy_pass http://pedidos-service:8082/api/pedidos;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    # Parcial 2: API del microservicio administrador de mensajería (solo rol ADMIN)
    location /api/admin {
        proxy_pass http://mensajeria-admin:8090/api/admin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }
}
