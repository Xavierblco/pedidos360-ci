server:
  port: 8082

spring:
  application:
    name: pedidos-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  # Parcial 2: región de AWS para el cliente SNS. Las credenciales se leen de las variables
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN (local) o del rol LabRole (EC2).
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

cognito:
  issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# URL base de productos-service. En Docker Compose es el nombre del servicio; en AWS,
# la URL interna de la instancia EC2 (o, si se prefiere, otra ruta de API Gateway).
productos:
  service:
    url: ${PRODUCTOS_SERVICE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Parcial 2: mensajería. Ningún nombre de tópico va escrito en el código; se lee de aquí.
mensajeria:
  habilitada: ${MENSAJERIA_HABILITADA:true}
  topico-eventos: ${TOPICO_EVENTOS:pedidos360-eventos}
