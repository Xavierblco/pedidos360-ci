# Compila y prueba todos los componentes en cada push / pull request.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [productos-service, pedidos-service, eventos-service, mensajeria-admin]
    defaults:
      run:
        working-directory: backend/${{ matrix.servicio }}
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (${{ matrix.servicio }})
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Resumen de errores
        if: failure()
        run: |
          resumen() { sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::error title=mvn ${{ matrix.servicio }}::$(grep -E '\[ERROR\]|Tests run:|Caused by|Exception' build.log | head -80 | resumen)"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && echo "::error title=$(basename "$f")::$(head -60 "$f" | resumen)"
          done
          true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build